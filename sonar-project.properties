# Read by the code-quality job in github-actions/quality-gates.yml.
#
# Scope is the paths the rest of the pipeline covers. If you add a service
# (a worker, a second API), add it here and in the workflows together, or the
# quality gate will silently ignore it.

sonar.projectKey=example-pipeline
sonar.projectName=Example Pipeline

sonar.sources=examples/app/backend/app,examples/app/frontend/src
sonar.tests=examples/app/backend/tests,examples/app/frontend/src
sonar.test.inclusions=**/test_*.py,**/*.test.js,**/*.test.jsx

# Exclude generated and vendored code — analysing it produces noise, not signal.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.min.js,examples/app/backend/alembic/versions/**

sonar.python.version=3.11

# Coverage import is a deliberate next step, not an oversight.
#
# The unit-test job already produces coverage.xml as an artifact. Wiring Sonar
# to consume it requires uploading the artifact and passing its path here,
# which adds a moving part to the first working version of the pipeline. Left
# as plain analysis until the baseline is confirmed working — a gate you trust
# is worth more than one you have not verified.
#
# To enable:
#   1. upload-artifact coverage.xml in the unit-tests job (already partly done)
#   2. download it in the code-quality job
#   3. sonar.python.coverage.reportPaths=coverage.xml
