[pytest]
# Run pytest from the backend/ directory (where this file lives) so relative
# paths resolve the same way they do for uvicorn.
asyncio_mode = auto
# Set explicitly: pytest-asyncio warns that this will change default in a
# future release. Pinning it now keeps the suite's behaviour stable across
# upgrades instead of changing under us.
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
